version: 2

models:
  - name: dim_products
    description: "One row per product with its category, type, and description."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: product_category
        data_tests:
          - not_null
      - name: product_type
        data_tests:
          - not_null
      - name: product_detail
        data_tests:
          - not_null
