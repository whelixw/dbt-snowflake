version: 2

models:
  - name: stg_customers
    description: Cleaned customer records loaded from the placeholder seed.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [active, inactive, trial]
