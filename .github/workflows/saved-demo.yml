name: Saved demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
